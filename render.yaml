# Render.com Blueprint for the WA Scheduler (WhatsApp group post scheduler).
# In the Render dashboard: New -> Blueprint, point it at this repo, apply.
# Docs: https://render.com/docs/blueprint-spec
#
# This is an always-on service: the scheduler polls for due posts in-process,
# so the instance MUST NOT sleep (do not use the free plan). It also needs a
# persistent disk -- the SQLite DB, the WhatsApp login (Baileys auth), and
# uploaded media all live on disk, and without the disk every deploy wipes
# them (you'd re-scan the QR and lose scheduled posts).
#
# NOTE: automating WhatsApp via Baileys is against WhatsApp's Terms of Service
# and can get the number banned. Keep volume low and human-like.

services:
  - type: web
    name: wa-scheduler
    runtime: node
    plan: starter         # always-on; do NOT use 'free' (it sleeps -> missed posts)
    region: oregon
    branch: main
    buildCommand: "npm ci"
    startCommand: "npm start"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Pin the runtime: the app uses node:sqlite (DatabaseSync), which needs a
      # recent Node. This matches the version it was built and tested against.
      - key: NODE_VERSION
        value: "26.13.0"
      # Dashboard login password -- set as a secret in the dashboard, do NOT
      # commit it. Without it the app falls back to the insecure default.
      - key: DASHBOARD_PASSWORD
        sync: false
      # Session cookie signing key -- Render generates a strong random value.
      - key: SESSION_SECRET
        generateValue: true
      # Point the data + uploads dirs at the persistent disk (mounted below) so
      # the DB, WhatsApp sessions, and media survive restarts and deploys.
      - key: DATA_DIR
        value: /var/wa-data/data
      - key: UPLOADS_DIR
        value: /var/wa-data/uploads
    disk:
      name: wa-data
      mountPath: /var/wa-data
      sizeGB: 1
